name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      cancel_deployment:
        description: "Optional: SHA or ID of a stale Pages deployment to cancel before publishing"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check sleep calculations
        run: node analysis.cjs
      - name: Cancel explicitly selected stale Pages deployment
        if: github.event_name == 'workflow_dispatch' && inputs.cancel_deployment != ''
        env:
          GH_TOKEN: ${{ github.token }}
          STALE_DEPLOYMENT: ${{ inputs.cancel_deployment }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$STALE_DEPLOYMENT" =~ ^([[:xdigit:]]{40}|[0-9]+)$ ]]; then
            echo "Expected a deployment SHA or numeric ID."
            exit 1
          fi
          endpoint="repos/${GITHUB_REPOSITORY}/pages/deployments/${STALE_DEPLOYMENT}"
          gh api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' "${endpoint}/cancel"
          for attempt in {1..12}; do
            status=$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' "$endpoint" --jq '.status')
            echo "Pages deployment status: $status"
            case "$status" in
              succeed|succeeded|canceled|cancelled|failed|failure|errored)
                exit 0
                ;;
            esac
            sleep 5
          done
          echo "The old Pages deployment has not stopped; refusing to overlap deployments."
          exit 1
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
