const LEGACY_KEY='son-rebenka-simple-v15';

  const saved=JSON.parse(localStorage.getItem(storageKey)||'null');

  else {state=blank();profiles=[];}
  state.journal=Array.isArray(state.journal)?state.journal:[];

 } catch(e){storageError=true;state=blank();state.profileId=newId();profiles=[];}

readLocal();

 try {const i=profiles.findIndex(p=>p.profileId===state.profileId);const copy=JSON.parse(JSON.stringify(state));if(i<0)profiles.push(copy);else profiles[i]=copy;localStorage.setItem(storageKey,JSON.stringify({state,profiles}));storageError=false;}
 catch(e){storageError=true;}
 if(storageError)showStorageWarning();

function dd(h){let n=Math.round(h);return Math.max(0,Math.min(100,n))+'%'}
function ageMonths(){return Number(state.years||0)*12+Number(state.months||0)}

function norm(){let m=ageMonths();if(m<4)return {min:14,max:17,label:'0–3 месяца',caution:true};if(m<12)return {min:12,max:16,label:'4–11 месяцев'};if(m<36)return {min:11,max:14,label:'1–2 года'};if(m<72)return {min:10,max:13,label:'3–5 лет'};return {min:9,max:12,label:'6–10 лет'};}
function numMin(time){if(!/^\d{2}:\d{2}$/.test(time))return null;let [h,m]=time.split(':').map(Number);if(h>23||m>59)return null;return h*60+m}
function between(a,b){let x=numMin(a),y=numMin(b);if(x===null||y===null)return null;return (y-x+1440)%1440;}
function addTime(t,minutes){let n=numMin(t);if(n===null)return '—';let c=(n+minutes+1440*5)%(1440);return `${String(Math.floor(c/60)).padStart(2,'0')}:${String(c%60).padStart(2,'0')}`}

function sleepStats(s=state){
 const age=Number(s.years||0)*12+Number(s.months||0);
 if(age<4){const night=s.infantNight===''||s.infantNight===undefined?null:Math.round(Number(s.infantNight)*60);const nap=s.infantDay===''||s.infantDay===undefined?null:Math.round(Number(s.infantDay)*60);const total=night!==null&&nap!==null?night+nap:s.dailySleep===''?null:Math.round(Number(s.dailySleep)*60);return {night,nap,total,nightWindow:null,napKnown:nap!==null,awakeKnown:night!==null};}
 const window=between(s.asleep,s.wake),nap=s.nap===''?null:Number(s.nap);
 const awake=s.nightAwake==='unknown'||s.nightAwake===''?null:Number(s.nightAwake);
 const night=window===null||awake===null?null:window-awake;
 return {night,nap,total:night===null||nap===null?null:night+nap,nightWindow:window,napKnown:nap!==null,awakeKnown:awake!==null};
}

 if(morning.some(x=>['sleepy','hard','irritable'].includes(x)))notes.push('Вы отметили сонливость, трудное или раздражительное пробуждение. Сопоставьте это с длительностью сна и записями нескольких дней; даже при достаточном числе часов качество сна может отличаться. Если выраженная сонливость сохраняется, обсудите её с педиатром.');

function result(){let n=norm(),d=sleepStats(),total=d.total,partial=total===null&&d.napKnown&&d.nightWindow!==null,estimate=partial?d.nightWindow+d.nap:total;let diff=(estimate===null?null:estimate/60),classif=(estimate===null?'unknown':diff<n.min?'low':diff>n.max?'high':'normal');let precise=total!==null;let status='',desc='';if(estimate===null){status='Нужно уточнить сон';desc='Часть данных о сне не указана. Показываем только известные значения; неизвестные не считаем нулём.';}else if(!precise){status='Есть предварительный расчёт';desc='Неизвестно, сколько ребёнок бодрствует ночью. Интервал между засыпанием и подъёмом известен, но без длительности бодрствования точный ночной и общий сон не определить.';}else if(classif==='normal'){status='По длительности сон в возрастном диапазоне';desc='Это хороший ориентир. Самочувствие и качество сна тоже важны.';}else if(classif==='low'){status='Сна может быть недостаточно';desc='По введённым данным сон короче рекомендуемого диапазона. Посмотрите на самочувствие и повторите записи несколько дней.';}else{status='Сон дольше возрастного диапазона';desc='Это не диагноз, но стоит уточнить, насколько типичен такой день и как ребёнок себя чувствует.';}

  $('authForm').onsubmit=e=>{e.preventDefault();authenticate(false);};$('signUp').onclick=()=>authenticate(true);$('verifyCode').onclick=verifyEmail;cloudMessage('Локальный режим. Войдите, чтобы сохранить копию в аккаунте.');
 }else{
  $('accountBody').innerHTML=`<p>Вы вошли: <b>${safe(activeUser.email||'Семья')}</b></p><div class="pageNav"><button class="btn" id="uploadFamily">Сохранить в аккаунт</button><button class="btn secondary" id="loadFamily">Показать записи аккаунта</button></div><p class="hint">Сохраняется выбранный ребёнок: ${safe(state.name||'без имени')}, ${state.journal.length} записей. После изменений сохраняйте копию повторно. При конфликте двух устройств приложение предложит сначала загрузить актуальную версию.</p><button class="textButton" id="importGuest">Импортировать локальные анкеты этого браузера</button><div id="remoteProfiles"></div><div class="sep"></div><label class="checkLine"><input id="statsConsent" type="checkbox">Разрешаю использование обезличенных числовых данных сна для общей статистики. Это необязательно; согласие можно отозвать здесь.</label><button class="textButton" id="saveConsent">Сохранить решение о статистике</button><p id="consentStatus" class="hint" role="status"></p><button class="textButton" id="signOut">Выйти из аккаунта</button>`;
  $('uploadFamily').onclick=uploadFamily;$('loadFamily').onclick=loadFamily;$('importGuest').onclick=importGuest;$('saveConsent').onclick=saveConsent;$('signOut').onclick=async()=>{const {error}=await client.auth.signOut();if(error){cloudMessage('Не удалось выйти. Проверьте сеть.',true);return;}await useSession(null,true);go('account');};
  cloudMessage('Аккаунт подключён. Данные отправляются только по кнопке сохранения.');
  const {data,error}=await client.from('sleep_statistics_consent').select('allowed').maybeSingle();if(state.screen!=='account'||!$('statsConsent'))return;if(error){$('statsConsent').disabled=true;$('saveConsent').disabled=true;$('consentStatus').textContent='Не удалось получить согласие. Данные для статистики не отправляются.';}else{$('statsConsent').checked=data?.allowed===true;$('consentStatus').textContent=data?.allowed?'Согласие включено. Публичная статистика пока не запущена.':'Согласие выключено.';}
 }
 }catch(e){cloudMessage('Подключение недоступно. Дневник остаётся на устройстве. Попробуйте позже.',true);}
}
async function useSession(session,change){
 const user=session?.user||null;const next=user?'son-rebenka-v17:'+user.id:'son-rebenka-v17:guest';
 if(next!==storageKey){save();storageKey=next;readLocal();if(change)state.screen='account';save();}activeUser=user;
}
async function authenticate(signup){
 const form=$('authForm');if(!form.reportValidity())return;
 const email=$('familyEmail').value.trim(),password=$('familyPassword').value, client=getCloud();
 $('signIn').disabled=true;$('signUp').disabled=true;cloudMessage(signup?'Создаём аккаунт…':'Входим…');
 try{const result=signup?await client.auth.signUp({email,password,options:{emailRedirectTo:'https://katerinamakart.github.io/Son-rebenka/'}}):await client.auth.signInWithPassword({email,password});
 $('familyPassword').value='';if(result.error){cloudMessage(result.error.status===429?'Слишком много попыток. Попробуйте позже.':signup?'Не удалось создать аккаунт. Проверьте email и пароль или попробуйте войти.':'Не удалось войти. Проверьте email, пароль и подтверждение почты.',true);return;}
 if(result.data.session){await useSession(result.data.session,true);go('account');}else cloudMessage('Проверьте почту и подтвердите email. После подтверждения войдите с паролем.');
 }catch(e){cloudMessage('Нет связи с сервером. Локальные записи сохранены.',true);}finally{if($('signIn'))$('signIn').disabled=false;if($('signUp'))$('signUp').disabled=false;}
}
async function verifyEmail(){const client=getCloud(),email=$('familyEmail')?.value.trim(),token=$('emailCode').value.trim();if(!email||!token){cloudMessage('Введите email и код из письма.',true);return;}const {data,error}=await client.auth.verifyOtp({email,token,type:'signup'});$('emailCode').value='';if(error){cloudMessage('Код не подошёл или истёк. Проверьте письмо.',true);return;}await useSession(data.session,true);go('account');}
async function uploadFamily(){
 if(!activeUser||state.years===''){cloudMessage('Сначала заполните анкету ребёнка.',true);return;}
 const snapshot=JSON.parse(JSON.stringify(state));const {journal,profileId,cloudRevision,diaryDraft,savedEntryMessage,previousScreen,screen,...payload}=snapshot;
 $('uploadFamily').disabled=true;cloudMessage('Сохраняем анкету и дневник…');
 try{const {data,error}=await getCloud().rpc('save_sleep_family',{p_id:profileId,p_payload:payload,p_entries:journal,p_expected:cloudRevision||null});if(error)throw error;
 state.cloudRevision=data;save();cloudMessage('Анкета и '+journal.length+' записей сохранены в аккаунте.');}
 catch(e){cloudMessage(String(e.message||'').includes('SYNC_CONFLICT')?'На сервере есть другая версия. Нажмите «Показать записи аккаунта» и загрузите её перед сохранением. Локальные данные не удалены.':'Не удалось сохранить в аккаунт. Локальная копия остаётся на устройстве; повторите позже.',true);}finally{if($('uploadFamily'))$('uploadFamily').disabled=false;}
}
async function loadFamily(){
 cloudMessage('Загружаем список анкет…');try{const {data,error}=await getCloud().from('sleep_profiles').select('id,payload,updated_at').order('updated_at',{ascending:false});if(error)throw error;
 if(!$('remoteProfiles'))return;$('remoteProfiles').innerHTML=data.length?data.map((p,i)=>`<div class="journalRow"><div><b>${safe(p.payload.name||'Ребёнок без имени')}</b><small>${safe(p.payload.years)} лет · сохранено ${safe(new Date(p.updated_at).toLocaleString('ru-RU'))}</small></div><button class="textButton" data-cloud-profile="${i}">Загрузить</button></div>`).join(''):'<p class="muted">В аккаунте пока нет анкет.</p>';
 $('remoteProfiles').querySelectorAll('[data-cloud-profile]').forEach(b=>b.onclick=async()=>{const profile=data[Number(b.dataset.cloudProfile)];if(!confirm('Загрузить версию из аккаунта? Текущая локальная анкета будет заменена. При несохранённых изменениях сначала скачайте JSON из дневника.'))return;
 const {data:rows,error}=await getCloud().from('sleep_entries').select('payload').eq('profile_id',profile.id).order('entry_date',{ascending:false});if(error){cloudMessage('Не удалось загрузить записи. Локальные данные не изменены.',true);return;}
 save();state={...blank(),...profile.payload,profileId:profile.id,cloudRevision:profile.updated_at,journal:rows.map(r=>r.payload),screen:'diary'};state.savedEntryMessage='Запись сохранена на устройстве.';state.diaryDraft=null;save();go('diary');});cloudMessage('Список получен. Выберите анкету для загрузки.');
 }catch(e){cloudMessage('Не удалось получить список. Проверьте соединение.',true);}
}
function importGuest(){try{const guest=JSON.parse(localStorage.getItem('son-rebenka-v17:guest')||'null');const old=JSON.parse(localStorage.getItem(LEGACY_KEY)||'null');let incoming=guest?.profiles|| (old?[old]:[]);if(!incoming.length){cloudMessage('Локальных анкет для импорта нет.');return;}incoming=incoming.filter(p=>p.years!=='');for(const profile of incoming){const clone={...profile,profileId:newId(),cloudRevision:undefined,screen:'home'};profiles.push(clone);state=clone;}save();go('account');cloudMessage('Локальные анкеты добавлены в этот аккаунт на устройстве. Нажмите «Сохранить в аккаунт» для выбранного ребёнка.');}catch(e){cloudMessage('Не удалось импортировать локальные данные.',true);}}
async function saveConsent(){const allowed=$('statsConsent').checked;const {error}=await getCloud().from('sleep_statistics_consent').upsert({family_id:activeUser.id,allowed,policy_version:'2026-11-05',updated_at:new Date().toISOString()});$('consentStatus').textContent=error?'Решение не сохранено. Повторите позже.':allowed?'Отдельное согласие сохранено. Публичная статистика пока не запущена.':'Согласие отозвано. Личный дневник остаётся доступен.';}

async function initializeCloud(){const client=getCloud();if(!client)return;const {data,error}=await client.auth.getSession();if(error)return;const old=storageKey;await useSession(data.session,false);authReady=true;if(storageKey!==old||state.screen==='account')go(['home','age','sleep','supplement','feel','morning','evening','load','conditions','result','diary','account'].includes(state.screen)?state.screen:'home');}
document.addEventListener('DOMContentLoaded',initializeCloud);
go(['home','age','sleep','supplement','feel','morning','evening','load','conditions','result','diary','account'].includes(state.screen)?state.screen:'home');
</script>
</body></html>
