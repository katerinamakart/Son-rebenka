function numMin(time){if(!/^\d{2}:\d{2}$/.test(time))return null;let [h,m]=time.split(':').map(Number);if(h>23||m>59)return null;return h*60+m}

function addTime(t,minutes){let n=numMin(t);if(n===null)return '—';let c=(n+minutes+1440*5)%(1440);return `${String(Math.floor(c/60)).padStart(2,'0')}:${String(c%60).padStart(2,'0')}`}

function sleepStatsLegacy(s=state){

 const night=window===null||awake===null?null:window-awake;

function feel(){conditions();}
function sanitizeAgeAnswers(){

function describeChoices(key,options){const a=selectedValues(key);return a.length?a.map(v=>options.find(x=>x[0]===v)?.[1]).filter(Boolean).join(', '):'Не указано';}
function contextHeadline(){const m=selectedValues('morningMood'),e=selectedValues('eveningMood');if(m.some(x=>['sleepy','hard','irritable'].includes(x)))return 'При этом вы отметили непростое утреннее пробуждение: важно наблюдать самочувствие, а не только число часов.';if(e.some(x=>['tired','active','fussy'].includes(x)))return 'Вы отметили усталость, капризы или сильную активность вечером. Это повод сопоставить день и сон в дневнике, а не готовое объяснение причины.';if(state.loadLevel==='tiring'||state.lateActivity==='yes')return 'День или последний час перед сном были насыщенными. Полезно сравнить с более спокойными днями, не меняя режим по одной анкете.';return 'Учитывайте утреннее и вечернее самочувствие: одна анкета не определяет качество сна или причину трудностей.';}
function contextAnalysis(){
 const morning=selectedValues('morningMood'),evening=selectedValues('eveningMood'),acts=selectedValues('activities');const notes=[];
 if(morning.some(x=>['sleepy','hard','irritable'].includes(x)))notes.push('Вы отметили сонливость, трудное или раздражительное пробуждение. Сопоставьте это с длительностью сна и записями нескольких дней; даже при достаточном числе часов качество сна может отличаться. Если выраженная сонливость сохраняется, обсудите её с педиатром.');
 else if(morning.includes('bright'))notes.push('Бодрое утреннее пробуждение — полезное наблюдение о самочувствии. Оно не заменяет оценку длительности и качества сна.');
 if(evening.some(x=>['tired','fussy','active'].includes(x)))notes.push('Усталость, капризы или сильная активность вечером могут сопровождать разные ситуации: насыщенный день, потребность в общении, неподходящее время сна. По одному такому признаку нельзя установить причину.');
 if(acts.some(x=>['sport','classes','impressions','travel','guests'].includes(x)))notes.push('В этот день были занятия, поездки, гости или необычные впечатления. Сравните несколько похожих дней с более спокойными, учитывая возраст, суммарный сон и утреннее состояние. Не нужно отменять занятия только по одной анкете.');
 if(state.loadLevel==='tiring')notes.push('День показался утомительным: попробуйте оставить больше спокойного времени для перехода ко сну и понаблюдать за результатом.');
 if(state.lateActivity==='yes')notes.push('Активность или яркие впечатления были в последний час. Можно попробовать более спокойное завершение дня и сравнить время засыпания, не меняя всё расписание сразу.');
 if(state.loadLevel==='little')notes.push('Движения было меньше обычного. При хорошем самочувствии поддерживайте подходящие возрасту прогулки и игры; не требуется специально утомлять ребёнка ради сна.');
 if(selectedValues('sleepNoise').includes('loud'))notes.push('Вы отметили резкие или громкие звуки. По возможности уменьшите их и посмотрите, совпадают ли они с пробуждениями.');
 if(state.sleepLight==='bright')notes.push('Ночью достаточно светло. Попробуйте более спокойное приглушённое освещение, сохранив безопасность и комфорт.');
 if(['hot','cold'].includes(state.sleepTemperature))notes.push('Температура кажется некомфортной. Проверьте одежду и условия в комнате; не перегревайте ребёнка и не ориентируйтесь только на цифры анкеты.');
 if(state.screenTime==='late')notes.push('Экраны есть в последний час перед сном. Можно постепенно заменить это время спокойным занятием и оценить изменения за несколько дней.');
 if(state.routine==='no'||selectedValues('rituals').includes('none'))notes.push('Привычная последовательность вечера пока не сложилась. Попробуйте 2–3 повторяющихся спокойных действия, подходящих вашей семье.');
 if(state.nightWakings!==''&&state.nightWakings!==undefined)notes.push('Вы указали ночных пробуждений: '+state.nightWakings+'. Само количество не определяет причину: важно также, сколько ребёнок бодрствовал и как чувствовал себя после сна.');
 if(!notes.length)notes.push('Дополнительных наблюдений пока мало либо день бывает разным. Это нормально: дневник за несколько дней поможет увидеть повторяющиеся сочетания сна и самочувствия.');
 return `<section class="contextSummary"><h3>Поведение, день и условия сна</h3><dl class="contextFacts"><dt>Утро</dt><dd>${safe(describeChoices('morningMood',MORNING))}</dd><dt>Вечер</dt><dd>${safe(describeChoices('eveningMood',EVENING))}</dd><dt>Занятия за день</dt><dd>${safe(describeChoices('activities',activityOptions()))}</dd></dl><ul class="tips">${notes.slice(0,3).map(x=>`<li>${safe(x)}</li>`).join('')}</ul>${notes.length>3?`<details><summary>Условия сна и дополнительные наблюдения (${notes.length-3})</summary><ul class="tips">${notes.slice(3).map(x=>`<li>${safe(x)}</li>`).join('')}</ul></details>`:''}<p class="helpInfo">Нагрузки, условия и поведение могут быть связаны со сном, но сами по себе не доказывают причину нарушения. Анкета не ставит диагноз и не увеличивает возрастной ориентир сна автоматически.</p><a href="${URLS.AAP}" target="_blank" rel="noopener noreferrer">О привычках сна: American Academy of Pediatrics</a></section>`;
}
function validateTimePickers(){for(const group of app.querySelectorAll('.clockPicker')){const h=group.querySelector('[data-clock=hours]'),m=group.querySelector('[data-clock=minutes]');if((h.value==='')!==(m.value==='')){alert('Выберите и часы, и минуты либо оставьте оба поля пустыми.');(h.value===''?h:m).focus();return false;}}return true;}

 app.querySelectorAll('input[placeholder="ЧЧ:ММ"]').forEach(input=>{
  if(input.nextElementSibling?.classList.contains('clockPicker'))return;input.type='hidden';const group=document.createElement('div');group.className='clockPicker';group.setAttribute('role','group');
  const caption=app.querySelector(`label[for="${input.id}"]`);const label=caption?.textContent||'Время';group.setAttribute('aria-label',label);
  const [hours,minutes]=(input.value||':').split(':');
  group.innerHTML=`<label class="clockPart"><span>Часы</span><select aria-label="${safe(label)} — часы" data-clock="hours"><option value="">—</option>${Array.from({length:24},(_,i)=>{const v=String(i).padStart(2,'0');return `<option value="${v}" ${hours===v?'selected':''}>${v}</option>`;}).join('')}</select></label><span class="clockColon" aria-hidden="true">:</span><label class="clockPart"><span>Минуты</span><select aria-label="${safe(label)} — минуты" data-clock="minutes"><option value="">—</option>${Array.from({length:60},(_,i)=>{const v=String(i).padStart(2,'0');return `<option value="${v}" ${minutes===v?'selected':''}>${v}</option>`;}).join('')}</select></label>`;
  input.after(group);if(caption){caption.htmlFor='';caption.addEventListener('click',()=>group.querySelector('select').focus());}
  group.querySelectorAll('select').forEach(el=>el.onchange=()=>{const h=group.querySelector('[data-clock=hours]').value,m=group.querySelector('[data-clock=minutes]').value;input.value=h!==''&&m!==''?h+':'+m:'';input.dispatchEvent(new Event('change',{bubbles:true}));input.dispatchEvent(new Event('input',{bubbles:true}));});
 });
}

function fmtTime(t){return /^\d{2}:\d{2}$/.test(t)?t:'—'}
function minutesFromDay(s){let st=sleepStats(s);if(st.total!==null)return st.total;if(st.nightWindow!==null&&st.nap!==null)return st.nightWindow+st.nap;return null;}
function missingSleepFields(){
 const missing=[];
 if(ageMonths()<4){if(state.infantNight===''||state.infantNight===undefined)missing.push(['infantNight','Сколько ребёнок спал ночью']);if(state.infantDay===''||state.infantDay===undefined)missing.push(['infantDay','Сколько ребёнок спал днём']);}
 else{if(numMin(state.asleep)===null)missing.push(['asleep','Время вечернего засыпания']);if(numMin(state.wake)===null)missing.push(['wake','Время утреннего пробуждения']);if(sleepStats().nap===null)missing.push(['nap','Продолжительность дневного сна']);if(state.nightAwake==='unknown'||state.nightAwake==='')missing.push(['nightAwake','Сколько времени ребёнок бодрствовал ночью']);}
 return missing;
}
function supplementLegacy(){
 const missing=missingSleepFields();sleep();
 app.querySelector('h2').textContent='Дополнить данные о сне';app.querySelector('.stepMark').textContent='Уточнение результата';app.querySelector('progress')?.remove();
 const intro=app.querySelector('h2').nextElementSibling;intro.textContent='Все предыдущие ответы сохранены. Уточните недостающие значения и сразу пересчитайте результат.';
 const note=document.createElement('div');note.className='helpInfo';note.innerHTML='<b>Для полного расчёта нужно уточнить:</b><ul>'+missing.map(([,label])=>'<li>'+safe(label)+'</li>').join('')+'</ul><p style="margin:8px 0 0">Если ночью не бодрствует, выберите «Нет». Если дневного сна нет — укажите 0. Если не знаете, можно оставить значение неизвестным и вернуться к результатам.</p>';intro.after(note);
 const missingIds=new Set(missing.map(([id])=>id));app.querySelectorAll('.fields>.field').forEach(field=>{const control=field.querySelector('input[id],select[id]');if(control&&!missingIds.has(control.id))field.hidden=true;});
 missing.forEach(([id])=>{const field=$(id)?.closest('.field');if(field){field.classList.add('missingField');const hint=document.createElement('span');hint.className='hint';hint.textContent='Нужно для полного расчёта';field.append(hint);}});

function resultLegacy(){let n=norm(),d=sleepStats(),total=d.total,partial=total===null&&d.napKnown&&d.nightWindow!==null,estimate=partial?d.nightWindow+d.nap:total;let diff=(estimate===null?null:estimate/60),classif=(estimate===null?'unknown':diff<n.min?'low':diff>n.max?'high':'normal');let precise=total!==null;let status='',desc='';if(estimate===null){status='Нужно уточнить сон';desc='Часть данных о сне не указана. Показываем только известные значения; неизвестные не считаем нулём.';}else if(!precise){status='Есть предварительный расчёт';desc='Неизвестно, сколько ребёнок бодрствует ночью. Интервал между засыпанием и подъёмом известен, но без длительности бодрствования точный ночной и общий сон не определить.';}else if(classif==='normal'){status='По длительности сон в возрастном диапазоне';desc='Это хороший ориентир. Самочувствие и качество сна тоже важны.';}else if(classif==='low'){status='Сна может быть недостаточно';desc='По введённым данным сон короче рекомендуемого диапазона. Посмотрите на самочувствие и повторите записи несколько дней.';}else{status='Сон дольше возрастного диапазона';desc='Это не диагноз, но стоит уточнить, насколько типичен такой день и как ребёнок себя чувствует.';}
if(n.caution){if(precise){status='Ориентир сна для малыша';}desc+=' Для возраста младше 4 месяцев индивидуальная изменчивость особенно велика; не ориентируйтесь на жёсткий график.';}
const risk=state.breathing==='yes'||state.issue==='nightcry';
let delta=total===null?'Нельзя определить: уточните длительность сна и пробуждений.':total<n.min*60?`До нижней границы не хватает ${display(n.min*60-total)}.`:total>n.max*60?`Выше верхней границы на ${display(total-n.max*60)}.`:`В пределах рекомендации: на ${display(total-n.min*60)} выше нижней границы, до верхней — ${display(n.max*60-total)}.`;
let html=`<section class="card screen"><div class="tag">${safe(state.name||'Ребёнок')} · ${ageText()}</div><h2>Итог анализа сна</h2><div class="softCard"><h3>Рекомендация по возрасту</h3><div class="sumline">${n.min}–${n.max} <small>часов за сутки</small></div><p>Для возраста ${n.label}, включая все дневные сны.${n.caution?' До 4 месяцев это ориентир, а не строгая норма.':''}</p>${normCitation(n)}</div><h3 style="margin-top:24px">По вашим данным</h3><p class="metricNote">Расчёты приложения по ответам родителей; это не измерение сна прибором.</p><div class="stats"><div class="stat"><span>Фактический ночной сон</span><b>${d.night!==null?display(d.night):'Неизвестно'}</b>${!d.awakeKnown&&d.nightWindow!==null?`<small>Интервал сна: ${display(d.nightWindow)}; пробуждения не указаны</small>`:''}</div><div class="stat"><span>Фактический дневной сон</span><b>${d.napKnown?display(d.nap):'Неизвестно'}</b></div><div class="stat full"><span>Фактический сон за сутки</span><b>${total!==null?display(total):'Не хватает данных'}</b></div></div>${total===null?`<div class="missingDataCallout"><p><b>Не хватает данных для полного расчёта.</b></p><p class="muted">${missingSleepFields().map(([,label])=>safe(label)).join('; ')}.</p><button class="btn" id="supplementData">Дополнить данные</button></div>`:''}<div class="helpInfo"><b>Разница с рекомендацией</b><p style="margin:6px 0 0">${delta}</p></div><div class="status ${classif==='low'||classif==='high'?'attention':''}"><h3>Вывод</h3><strong>${safe(status)}</strong>${safe(desc)}<p style="margin:10px 0 0">${safe(contextHeadline())}</p></div>`;
if((state.well==='tired'&&classif==='normal')||(!precise&&estimate!==null))html+=`<div class="status attention"><strong>${!precise?'Нужна дополнительная информация':'Смотрим не только на часы'}</strong>${!precise?'Попробуйте уточнить длительность бодрствования ночью и повторить проверку.':'Даже если часов достаточно, частая сонливость днём заслуживает внимания.'}</div>`;
if(risk)html+=`<div class="status attention"><strong>Когда стоит обратиться к врачу</strong>${state.breathing==='yes'?'Регулярный храп или паузы дыхания во сне нужно обсудить с педиатром. ':''}${state.issue==='nightcry'?'Повторяющиеся эпизоды сильного плача с неполным пробуждением также стоит обсудить с педиатром; полезна видеозапись. ':''}При остановке дыхания, посинении или судорогах нужна срочная помощь.</div>`;
html+=`${contextAnalysis()}<div class="sep"></div><h3>${state.mode==='check'?'Что делать дальше':'Что можно попробовать'}</h3><ul class="tips">${recommendations().map(x=>`<li>${x}</li>`).join('')}</ul>${adviceCitation('routine')}${renderSchedule()}${knowledge()}<div class="sep"></div><button class="btn pinkbtn" id="toDiary">Вести дневник сна <span aria-hidden="true">→</span></button><div class="center"><button class="textButton" data-go="age">Изменить ответы</button><button class="textButton" data-new-child="true">Проверить другого ребёнка</button></div><p class="disclaimer">Помощник не устанавливает диагноз и не заменяет консультацию врача. Ответы сохраняются в этом браузере. Регистрация не нужна.</p></section>`;
app.innerHTML=html;if($('supplementData'))$('supplementData').onclick=()=>go('supplement');$('toDiary').onclick=()=>go('diary');}
function recommendations(){let n=ageMonths(),t=[];

else if(n<12){t.push('Помогают дневной свет утром и спокойное освещение вечером. Дневные сны и ночные кормления зависят от возраста и потребностей малыша.');t.push('Соблюдайте правила безопасного сна и не отказывайтесь от кормлений только ради продления ночного сна.');}

function scheduleAgeGuide(months){
 if(months<4)return {min:0,max:0,label:'До 4 месяцев',text:'Очень гибкий ритм: число и время снов меняются.'};
 if(months<6)return {min:3,max:4,label:'4–5 месяцев',text:'Часто около 3 снов; иногда нужен четвёртый короткий сон.'};
 if(months<9)return {min:2,max:3,label:'6–8 месяцев',text:'Часто 2–3 сна: переход происходит постепенно.'};
 if(months<15)return {min:2,max:2,label:'9–14 месяцев',text:'Часто 2 дневных сна; возможны индивидуальные переходы.'};
 if(months<24)return {min:1,max:2,label:'15–23 месяца',text:'Часто переход к одному сну; два сна ещё возможны.'};
 if(months<36)return {min:1,max:1,label:'2 года',text:'Многим подходит один дневной сон.'};
 if(months<60)return {min:0,max:1,label:'3–4 года',text:'Один сон или тихий отдых: потребность постепенно меняется.'};
 return {min:0,max:0,label:'От 5 лет',text:'Дневного сна может не быть; важны ночной сон и самочувствие.'};
}
function regimeComparison(s=state){

   let guide=(i===0?(g.max===1?'Днём, часто около обеда':'В первой части дня'):i===1?'Позже, после бодрствования':i===2?'Дополнительный сон, если нужен':'Короткий дополнительный сон')+(optional?' · необязательно':'');
   let comment=nap?'Длительность: '+display(nap.duration)+'.':mode==='legacy'?'Известна только общая сумма; пропуск не определяем.':mode==='none'?(optional?'Этот сон может не требоваться.':'Возможный пропуск сна: днём не спал.'):mode==='intervals'?(optional?'Необязательный сон не записан.':'В записи сна нет; уточните, был ли он.'):'Нет данных — это не означает, что сон пропущен.';
   let tone=mode==='none'&&!optional?'attention':'neutral';
   if(nap&&i===d.napRows.length-1&&d.beforeSettling!==null&&d.beforeSettling<=120&&d.settling!==null&&d.settling>=30){comment+=' Близко к укладыванию: до него '+display(d.beforeSettling)+'. Возможно, сон ещё не нужен.';tone='attention';}

  if(mode==='none'&&g.min>0){comment='Днём не было сна; к вечеру могла накопиться усталость. Это возможное объяснение, не диагноз.';tone='attention';}
  else if(d.beforeSettling!==null&&d.beforeSettling<=120&&d.settling!==null&&d.settling>=30){comment='До укладывания только '+display(d.beforeSettling)+', затем долгое засыпание. Возможно, времени бодрствования было мало.';tone='attention';}

  add('Последнее бодрствование',d.lastWake===null?'Неизвестно':display(d.lastWake),'Индивидуально, по самочувствию',comment,tone);
 }

function renderSchedule(){const c=regimeComparison();return `<section class="regimeCompare" aria-labelledby="regimeTitle"><div class="sep"></div><h3 id="regimeTitle">Сравнение режима</h3><p class="metricNote">${safe(c.guide.label)} · ${safe(c.guide.text)}</p><p class="metricNote">Слева — ваши данные, рядом — возможный вариант по возрасту. Вечерняя граница рассчитана от следующего подъёма; это не назначение.</p><table class="regimeTable"><thead><tr><th scope="col">Этап дня</th><th scope="col">Как у вас</th><th scope="col">Возрастной ориентир</th><th scope="col">Комментарий</th></tr></thead><tbody>${c.rows.map(r=>`<tr class="${r.tone==='attention'?'regimeAttention':''}"><th scope="row">${safe(r.stage)}</th><td data-label="Как у вас">${safe(r.actual)}</td><td data-label="Возрастной ориентир">${safe(r.guide)}</td><td data-label="Комментарий">${r.tone==='attention'?'<b class="regimeFlag">Обратите внимание</b>':''}${safe(r.comment)}</td></tr>`).join('')}</tbody></table><p class="metricNote">Подсветка — повод уточнить режим, не диагноз. Сочетание «до укладывания не более 2 ч + укладывание от 30 мин» — условный сигнал приложения для проверки, не возрастная норма.</p>${adviceCitation('regime-method')}</section>`;}

function diaryInfant(){let rows=state.journal.slice().sort((a,b)=>b.date.localeCompare(a.date));const date=new Date(),today=`${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
app.innerHTML=`<section class="card screen"><div class="tag">Дневник младенца · ${safe(state.name||'ребёнок')}</div><h2>Сколько малыш спал?</h2><p class="muted">Сложите отрезки фактического сна за последние 24 часа: отдельно ночью и днём, исключая кормления и бодрствование.</p><div class="fields"><div class="field"><label for="jd">Дата</label><input type="date" id="jd" value="${today}"></div><div class="field"><label for="jinfantNight">Сон ночью, часов</label><input type="number" id="jinfantNight" min="0" max="24" step="0.25" inputmode="decimal" placeholder="Например, 9.5"></div><div class="field"><label for="jinfantDay">Сон днём, часов</label><input type="number" id="jinfantDay" min="0" max="24" step="0.25" inputmode="decimal" placeholder="Например, 6"></div><div class="field full"><label for="je">Что было особенного?</label><select id="je"><option value="none">Обычный день</option><option value="growth">Скачок роста (ребёнок быстро растёт)</option><option value="skill">Новый навык (переворачивается, тянется к игрушке)</option><option value="illness">Болезнь / боль</option><option value="changes">Перемены / стресс</option></select></div></div><button class="btn" id="saveInfant">Сохранить день</button><div class="sep"></div><h3>Все записи</h3>${rows.length?rows.map(e=>`<div class="journalRow"><div><b>${safe(e.date)} · ${e.totalMinutes!==undefined?display(e.totalMinutes):'—'}</b><small>Ночью: ${e.nightMinutes!==undefined?display(e.nightMinutes):'не указано'} · днём: ${e.napMinutes!==undefined?display(e.napMinutes):'не указано'}</small></div><button class="textButton" data-delete="${safe(e.date)}">Удалить</button></div>`).join(''):'<p class="muted">Записей пока нет.</p>'}<button class="textButton" id="export">Скачать данные в JSON</button></section>`;
